<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>전설의 검 강화하기</title>
    <style>
        body {
            background-color: #1e1e24;
            color: #fff;
            font-family: 'Comic Sans MS', '맑은 고딕', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            user-select: none;
        }
        #game-box {
            width: 480px;
            background: #2b2b36;
            border: 6px solid #ffcc00;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 0 25px rgba(255, 204, 0, 0.4);
            position: relative;
        }
        h1 { color: #ffcc00; text-shadow: 2px 2px #000; margin-top: 0; font-size: 26px; }
        .display-area {
            background: #111;
            border: 3px inset #555;
            height: 130px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            position: relative;
            border-radius: 8px;
        }
        #item-name { font-size: 22px; font-weight: bold; margin-bottom: 8px; }
        #item-level { font-size: 36px; color: #00ffcc; text-shadow: 0 0 10px #00ffcc; font-weight: bold; }
        .stats {
            display: flex;
            justify-content: space-between;
            background: #3a3a4c;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 15px;
        }
        .btn-group { display: flex; gap: 10px; margin-bottom: 10px; }
        button {
            flex: 1;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px #000;
            transition: transform 0.1s;
        }
        button:active { transform: translateY(3px); box-shadow: 0 1px #000; }
        #btn-upgrade { background: #ff4500; color: white; }
        #btn-upgrade:hover { background: #ff5722; }
        #btn-work { background: #4caf50; color: white; }
        #btn-work:hover { background: #66bb6a; }
        #btn-minigame { background: #9c27b0; color: white; width: 100%; margin-top: 5px; }
        #btn-minigame:hover { background: #ab47bc; }
        
        #log {
            margin-top: 10px;
            height: 40px;
            font-size: 14px;
            color: #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1e1e24;
            border-radius: 6px;
        }
        
        /* 미니게임 모달 */
        #modal-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 10px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        #minigame-box {
            width: 80%;
            background: #333;
            border: 3px solid #ffcc00;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }
        .gauge-bar {
            width: 100%;
            height: 30px;
            background: #555;
            border-radius: 15px;
            position: relative;
            margin: 20px 0;
            overflow: hidden;
            border: 2px solid #fff;
        }
        .target-zone {
            position: absolute;
            top: 0; bottom: 0;
            background: #00ffcc;
            box-shadow: 0 0 10px #00ffcc;
        }
        .pointer {
            position: absolute;
            top: 0; bottom: 0; width: 6px;
            background: #ff0055;
            box-shadow: 0 0 8px #ff0055;
        }
        .shake { animation: shake 0.2s infinite; }
        @keyframes shake {
            0% { transform: translate(2px, 2px); }
            50% { transform: translate(-2px, -2px); }
            100% { transform: translate(2px, -2px); }
        }
    </style>
</head>
<body>

<div id="game-box">
    <h1>⚔️ 무한 강화왕 ⚔️</h1>
    
    <div class="display-area" id="display">
        <div id="item-name" style="color: #aaa;">녹슨 단검</div>
        <div id="item-level">+0</div>
    </div>

    <div class="stats">
        <div>골드: <span id="gold" style="color: #ffd700;">0</span> G</div>
        <div>성공 확률: <span id="rate" style="color: #00ffcc;">100</span>%</div>
    </div>

    <div class="btn-group">
        <button id="btn-work" onclick="work()">💰 기본 알바<br><small style="font-weight:normal;" id="work-reward">(+10G)</small></button>
        <button id="btn-upgrade" onclick="upgrade()">🔥 강화하기<br><small style="font-weight:normal;">(<span id="cost">10</span>G)</small></button>
    </div>
    
    <button id="btn-minigame" onclick="startMinigame()">⚡ 타이밍 알바 (대박 알바)</button>

    <div id="log">버튼을 눌러 게임을 시작하세요!</div>

    <!-- 미니게임 레이어 -->
    <div id="modal-overlay">
        <div id="minigame-box">
            <h2 style="color: #ffcc00; margin-top: 0;">🎯 타이밍 맞추기!</h2>
            <p style="font-size: 14px; color: #ddd; margin-bottom: 5px;">빨간 바가 민트색 영역에 있을 때 버튼을 누르세요!</p>
            <div class="gauge-bar">
                <div class="target-zone" id="target-zone"></div>
                <div class="pointer" id="pointer"></div>
            </div>
            <button style="background: #ffcc00; color: #000; width: 100%; font-size: 18px;" onclick="hitMinigame()">정지!</button>
        </div>
    </div>
</div>

<script>
    let level = 0;
    let gold = 0;
    const names = ["녹슨 단검", "초보자의 검", "강철 검", "은빛 세이버", "화염의 검", "암흑의 대검", "용사령의 검", "신성한 엑스칼리버", "파멸의 레바테인", "신을 뚫는 창", "우주 창조의 파편"];
    
    function getSuccessRate(lvl) {
        if (lvl < 3) return 100;
        if (lvl < 5) return 80;
        if (lvl < 7) return 60;
        if (lvl < 9) return 40;
        if (lvl < 10) return 20;
        return 5;
    }

    function getCost(lvl) {
        return Math.floor(10 * Math.pow(1.8, lvl));
    }

    // 검이 좋을수록 알바 보상 대폭 증가 (기본 10G + 레벨별 배율 적용)
    function getWorkReward() {
        return Math.floor(10 * Math.pow(1.6, level));
    }

    function updateUI() {
        document.getElementById("gold").innerText = gold.toLocaleString();
        document.getElementById("item-level").innerText = "+" + level;
        document.getElementById("item-name").innerText = names[Math.min(level, names.length - 1)];
        document.getElementById("rate").innerText = getSuccessRate(level);
        document.getElementById("cost").innerText = getCost(level).toLocaleString();
        
        const reward = getWorkReward();
        document.getElementById("work-reward").innerText = `(+${reward.toLocaleString()}G)`;

        // 레벨별 색상 연출
        const colors = ["#aaa", "#fff", "#87ceeb", "#00ff00", "#0088ff", "#9900ff", "#ff00ff", "#ff4500", "#ff0000", "#ffd700", "#00ffff"];
        document.getElementById("item-name").style.color = colors[Math.min(level, colors.length - 1)];
    }

    function work() {
        const reward = getWorkReward();
        gold += reward;
        document.getElementById("log").innerText = `알바 완료! +${reward.toLocaleString()} G 획득!`;
        updateUI();
    }

    function upgrade() {
        const cost = getCost(level);
        if (gold < cost) {
            document.getElementById("log").innerText = "골드가 부족합니다!";
            return;
        }

        gold -= cost;
        const rate = getSuccessRate(level);
        const rand = Math.random() * 100;

        const display = document.getElementById("display");
        display.classList.add("shake");

        setTimeout(() => {
            display.classList.remove("shake");
            if (rand < rate) {
                level++;
                document.getElementById("log").innerHTML = `<span style="color:#00ff00; font-weight:bold;">★ 강화 성공! (+${level}) ★</span>`;
            } else {
                if (level >= 5) {
                    level = 0; // 5강 이상에서 실패 시 파괴
                    document.getElementById("log").innerHTML = `<span style="color:#ff0000; font-weight:bold;">💥 장비 파괴! (+0 리셋) 💥</span>`;
                } else {
                    document.getElementById("log").innerHTML = `<span style="color:#ff9900;">강화 실패... (단계 유지)</span>`;
                }
            }
            updateUI();
        }, 300);
    }

    // 미니게임 로직
    let minigameInterval = null;
    let pointerPos = 0;
    let pointerSpeed = 3;
    let targetStart = 40;
    let targetWidth = 20;

    function startMinigame() {
        document.getElementById("modal-overlay").style.display = "flex";
        
        // 타겟 위치 및 커서 초기화
        targetWidth = Math.max(10, 30 - level * 1.5); // 레벨이 높을수록 성공 영역이 좁아져 난이도 증가
        targetStart = 10 + Math.random() * (80 - targetWidth);
        
        const targetZone = document.getElementById("target-zone");
        targetZone.style.left = targetStart + "%";
        targetZone.style.width = targetWidth + "%";

        pointerPos = 0;
        pointerSpeed = 2 + Math.random() * 2 + level * 0.2; // 레벨이 올라갈수록 빨라짐
        let direction = 1;

        if (minigameInterval) clearInterval(minigameInterval);
        
        minigameInterval = setInterval(() => {
            pointerPos += pointerSpeed * direction;
            if (pointerPos >= 98) {
                pointerPos = 98;
                direction = -1;
            } else if (pointerPos <= 0) {
                pointerPos = 0;
                direction = 1;
            }
            document.getElementById("pointer").style.left = pointerPos + "%";
        }, 16);
    }

    function hitMinigame() {
        clearInterval(minigameInterval);
        document.getElementById("modal-overlay").style.display = "none";

        const baseReward = getWorkReward();
        // 타겟 존 내에 포인터가 맞았는지 확인
        if (pointerPos >= targetStart && pointerPos <= (targetStart + targetWidth)) {
            const bonusReward = baseReward * 5; // 성공 시 기본 알바 보상의 5배!
            gold += bonusReward;
            document.getElementById("log").innerHTML = `<span style="color:#00ffcc; font-weight:bold;">🎉 타이밍 대성공! +${bonusReward.toLocaleString()} G (5배 보상!)</span>`;
        } else {
            const smallReward = Math.floor(baseReward * 0.5);
            gold += smallReward;
            document.getElementById("log").innerText = `아쉬운 실패... +${smallReward.toLocaleString()} G만 획득했습니다.`;
        }
        updateUI();
    }

    updateUI();
</script>

</body>
</html>
